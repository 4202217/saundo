<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>saundo · flyout mockup</title>
<!--
  saundo flyout mockup template.

  Copy this file to .audit/mockups/<topic>/flyout.html and edit only the
  marked blocks: COPY, DEVICES, STATES, the state functions, and the notes.
  Keep the tokens, flyout chrome, toolbar, and helpers.

  The flyout is 420 wide. Its height follows flyoutHeightFor in
  internal/app/flyout.go: base 459 for three device rows, 62 less because the
  media card replaces the old Now Playing row, 90 for the permanent ambient
  section, +150 while a media session exists, +44 for the latency row, +48 for
  the connection error bar, and +53 for the expanded ambient grid
  (flyoutHeightForState). The device card and the playback card touch through
  the body's 8 DIP gap; there is no flexible spacer.

  Render:
    chrome --headless=new --hide-scrollbars --window-size=1400,900 \
      --screenshot=.audit/previews/<topic>.png file:///.../flyout.html

  Headless shots can select a state from the URL:
    ?state=idle|streaming|empty|error&lang=zh|en&dark=0|1
    &latency=0|1&media=0|1&lamp=cover|template|expanded&zoom=1|1.25|1.5
-->
<style>
  * { box-sizing: border-box; }
  html, body { min-height: 100%; }
  body {
    --bg: #f4f4f6; --panel: #f2f2f5; --card: #ffffff; --card-hover: #f9f9fb;
    --pill: #f1f1f4; --pill-hover: #e9e9ed; --line: #e3e3e8; --line2: #ececf0;
    --fg: #1c1c21; --fg2: #4b4b53; --ctl: #63636b; --muted: #85858d; --faint: #b9b9c2;
    --accent: #4f46e5; --accent-soft: #eeedfd; --accent-fg: #ffffff;
    --sel: #ecebfb; --green: #189a58; --green-soft: #e4f6ec;
    --red: #d64545; --red-soft: #fbe9e9;
    --raised-shadow: 0 1px 2px rgba(0, 0, 0, .14);
    --flyout-shadow: 0 22px 60px rgba(20, 22, 30, .30);
    --ease: cubic-bezier(.16, 1, .3, 1);
    color-scheme: light;
    margin: 0;
    background: #e8e8ed;
    color: var(--fg);
    font-family: "Segoe UI Variable Text", "Segoe UI", "Microsoft YaHei UI", "Microsoft YaHei", system-ui, sans-serif;
    font-size: 13px;
    -webkit-font-smoothing: antialiased;
  }
  body.dark {
    --bg: #1a1a1e; --panel: #1b1c20; --card: #232327; --card-hover: #26262b;
    --pill: #2d2d33; --pill-hover: #35353c; --line: #333339; --line2: #2c2c32;
    --fg: #ededf1; --fg2: #b9b9c1; --ctl: #a1a1aa; --muted: #8b8b94; --faint: #56565f;
    --accent: #a5b4fc; --accent-soft: #2b2c47; --accent-fg: #14142a;
    --sel: #33345a; --green: #6fd99b; --green-soft: #1e3a2b;
    --red: #f28b82; --red-soft: #45272a;
    --raised-shadow: 0 1px 2px rgba(0, 0, 0, .48);
    --flyout-shadow: 0 30px 90px rgba(0, 0, 0, .66);
    color-scheme: dark;
    background: #101013;
  }
  button, input, select { font: inherit; color: inherit; }
  button { border: 0; background: none; padding: 0; cursor: pointer; }
  .icon { display: inline-flex; width: 14px; height: 14px; flex: none; }
  .icon svg { display: block; width: 100%; height: 100%; }
  button:focus-visible, [role="button"]:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }

  /* ---------- mockup chrome ---------- */
  .toolbar {
    position: sticky; top: 0; z-index: 20;
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 10px 22px;
    background: rgba(255, 255, 255, .88);
    backdrop-filter: blur(14px);
    border-bottom: 1px solid rgba(28, 28, 33, .08);
  }
  body.dark .toolbar { background: rgba(18, 18, 22, .88); border-bottom-color: rgba(255, 255, 255, .07); }
  .brand { display: flex; align-items: center; gap: 8px; white-space: nowrap; }
  .brand .mark { width: 17px; height: 17px; display: inline-flex; color: var(--fg); }
  .brand .mark svg { display: block; width: 100%; height: 100%; }
  .brand-name { font-size: 14px; font-weight: 650; letter-spacing: -.15px; }
  .brand-sub { color: var(--muted); font-size: 11.5px; }
  .tool-sep { width: 1px; height: 16px; background: var(--line); margin: 0 2px; }
  .variant { display: inline-flex; align-items: center; gap: 7px; font-size: 11.5px; color: var(--fg2); white-space: nowrap; }
  .variant-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .toolbar .spacer { flex: 1; }
  .tool-label { font-size: 10.5px; color: var(--faint); letter-spacing: .4px; }
  .tool-group { display: flex; align-items: center; gap: 2px; padding: 2px; border-radius: 9px; background: var(--pill); }
  .tool-group button {
    height: 26px; min-width: 44px; padding: 0 8px; border-radius: 7px;
    font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums;
    transition: background 120ms var(--ease), color 120ms var(--ease);
  }
  .tool-group button:hover { color: var(--fg2); }
  .tool-group button.active { background: var(--card); color: var(--fg); box-shadow: var(--raised-shadow); }
  .tool {
    height: 30px; padding: 0 11px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--card);
    font-size: 11.5px; color: var(--fg2); white-space: nowrap;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .tool:hover { background: var(--pill); color: var(--fg); }
  .tool.active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .tool .icon { width: 13px; height: 13px; color: var(--muted); }

  .stagewrap {
    display: flex; align-items: flex-start; justify-content: center;
    gap: 32px; padding: 26px 24px 44px; flex-wrap: wrap;
  }
  .stage { flex: none; width: calc(420px * var(--zoom, 1)); height: calc(var(--fh, 500px) * var(--zoom, 1)); }
  .notes { width: 306px; padding-top: 2px; font-size: 12px; line-height: 1.65; color: var(--fg2); }
  .notes h2 { margin: 0 0 6px; font-size: 14.5px; font-weight: 650; letter-spacing: -.1px; color: var(--fg); }
  .notes-intro { margin: 0; font-size: 11.5px; line-height: 1.6; color: var(--muted); }
  .notes .kicker { margin: 18px 0 7px; font-size: 10px; letter-spacing: .8px; color: var(--faint); }
  .notes ul { margin: 0; padding: 0; list-style: none; }
  .notes li { position: relative; margin: 0 0 8px; padding-left: 13px; font-size: 11.5px; line-height: 1.6; color: var(--fg2); }
  .notes li::before { content: ""; position: absolute; left: 2px; top: 8px; width: 4px; height: 4px; border-radius: 50%; background: var(--faint); }
  .notes li b { font-weight: 600; color: var(--fg); margin-right: 4px; }

  /* ---------- flyout ---------- */
  .flyout {
    width: 420px; height: var(--fh, 500px); flex: none;
    display: flex; flex-direction: column;
    position: relative; overflow: hidden;
    border-radius: 12px; border: 1px solid var(--line);
    background: var(--panel); color: var(--fg);
    box-shadow: var(--flyout-shadow);
    transform: scale(var(--zoom, 1)); transform-origin: top left;
  }
  .flyout-head {
    height: 46px; flex: none; display: flex; align-items: center; gap: 8px;
    padding: 0 10px 0 14px;
  }
  .flyout-head .mark { width: 21px; height: 21px; color: var(--fg); }
  .app-name { font-size: 13px; font-weight: 600; line-height: 1.2; }
  .app-sub { font-size: 8.5px; font-weight: 600; letter-spacing: 1.1px; color: var(--muted); line-height: 1.2; }
  .flyout-head .spacer { flex: 1; }
  .icon-btn {
    width: 26px; height: 26px; border-radius: 7px;
    display: inline-flex; align-items: center; justify-content: center;
    color: var(--muted);
  }
  .icon-btn:hover { background: var(--pill); }
  .icon-btn .icon { width: 14px; height: 14px; }

  .flyout-body {
    flex: 1; min-height: 0; display: flex; flex-direction: column;
    padding: 2px 12px 8px 12px; gap: 8px;
  }
  .section-head {
    padding: 6px 2px 2px 2px;
    display: flex; align-items: center; gap: 8px;
  }
  .section-label { font-size: 11.5px; font-weight: 600; letter-spacing: .55px; color: var(--muted); }
  .section-note { margin-left: auto; font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card {
    border: 1px solid var(--line); border-radius: 10px;
    background: var(--card); overflow: hidden;
  }
  .device-card { flex: none; }
  .device-row {
    height: 56px; display: flex; align-items: center; gap: 10px;
    padding: 9px 12px;
  }
  .device-row + .device-row { border-top: 1px solid var(--line2); }
  .device-row.selected { background: var(--sel); }
  .device-row:hover:not(.selected) { background: var(--card-hover); }
  .device-pick { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; }
  .glyph {
    position: relative; width: 30px; height: 30px; flex: none;
    display: flex; align-items: center; justify-content: center;
    border-radius: 15px; background: var(--pill); color: var(--fg2);
  }
  .glyph .icon { width: 16px; height: 16px; }
  .device-row.selected .glyph { background: var(--card); color: var(--accent); }
  .glyph .online {
    position: absolute; right: -1px; bottom: -1px;
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--green); box-shadow: 0 0 0 2px var(--card);
  }
  .device-row.selected .glyph .online { box-shadow: 0 0 0 2px var(--sel); }
  .namecol { display: flex; flex-direction: column; gap: 1px; min-width: 0; flex: 1; }
  .name { font-size: 13px; font-weight: 500; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sub { font-size: 11.5px; line-height: 1.35; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row-action {
    height: 26px; flex: none; display: inline-flex; align-items: center; gap: 5px;
    padding: 0 8px; border-radius: 13px;
    font-size: 11.5px; font-weight: 500; white-space: nowrap;
  }
  .row-action .icon { width: 12px; height: 12px; }
  .row-action.accent { color: var(--accent); }
  .row-action.strong { color: var(--fg2); }
  .row-action.muted { color: var(--muted); }
  .row-action.faint { color: var(--faint); }
  .row-action:hover { background: var(--pill); }

  .empty-card {
    height: 141px; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 4px; padding: 18px;
    text-align: center;
  }
  .search-face { width: 28px; height: 28px; color: var(--faint); animation: pulse 1.2s ease-in-out infinite; }
  .search-face svg { display: block; width: 100%; height: 100%; }
  @keyframes pulse { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }
  .empty-title { font-size: 12.5px; font-weight: 500; color: var(--fg2); }
  .empty-hint { font-size: 11.5px; color: var(--muted); }
  .empty-action { margin-top: 2px; padding: 2px 6px; border-radius: 6px; font-size: 12.5px; color: var(--accent); }
  .empty-action:hover { background: var(--pill); }

  .error-bar {
    margin-top: 8px; padding: 8px 10px; border-radius: 8px;
    background: var(--red-soft); color: var(--red);
    font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  .playback-card { flex: none; }
  .volume { padding: 10px 12px 10px 12px; }
  .volume-head { display: flex; align-items: baseline; }
  .volume-label { font-size: 13px; font-weight: 500; }
  .volume-value { margin-left: auto; font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .range { position: relative; height: 20px; margin-top: 5px; padding: 0 8px; }
  .range::before {
    content: ""; position: absolute; left: 8px; right: 8px; top: 9px;
    height: 4px; border-radius: 2px; background: var(--line);
  }
  .range::after {
    content: ""; position: absolute; left: 8px; top: 9px;
    width: calc((100% - 16px) * var(--value, .65)); height: 4px;
    border-radius: 2px; background: var(--fg);
  }
  .range-knob {
    position: absolute; top: 3px; left: calc(8px + (100% - 16px) * var(--value, .65) - 8px);
    width: 16px; height: 16px; border-radius: 50%; background: #fff;
    box-shadow: 0 1px 3px rgba(0, 0, 0, .22);
  }
  .latency { padding: 6px 12px 10px 12px; }
  .line { height: 1px; background: var(--line2); }
  .seg {
    height: 30px; display: flex; gap: 2px; padding: 2px;
    border-radius: 8px; background: var(--pill);
  }
  .seg button {
    flex: 1; height: 26px; border-radius: 6px;
    display: inline-flex; align-items: center; justify-content: center; gap: 4px;
    font-size: 11.5px; color: var(--muted); white-space: nowrap;
  }
  .seg button .icon { width: 12px; height: 12px; }
  .seg button.active { background: var(--card); color: var(--fg); box-shadow: var(--raised-shadow); }
  body.dark .seg button.active { background: var(--pill-hover); box-shadow: none; }
  .seg button.active .icon { color: var(--accent); }

  /* ---------- media card ---------- */
  .media-card {
    margin: 8px 12px 10px 12px; padding: 8px 10px 8px 10px;
    border-radius: 12px; background: var(--pill);
  }
  .media-head { height: 28px; display: flex; align-items: center; gap: 7px; }
  .media-head .app-icon { width: 16px; height: 16px; flex: none; color: var(--fg2); }
  .media-app { flex: 1; min-width: 0; font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .media-switch {
    width: 24px; height: 24px; flex: none; border-radius: 7px;
    display: inline-flex; align-items: center; justify-content: center;
    background: var(--card); color: var(--muted);
  }
  .media-switch:hover { background: var(--card-hover); color: var(--fg); }
  .media-switch .icon { width: 12px; height: 12px; }
  .media-main { height: 62px; display: flex; align-items: center; gap: 10px; padding: 6px 0 4px 0; }
  .media-poster {
    width: 52px; height: 52px; flex: none; border-radius: 9px;
    display: flex; align-items: center; justify-content: center;
    background: var(--card); color: var(--muted);
  }
  .media-poster .icon { width: 18px; height: 18px; }
  .media-copy { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .media-title { font-size: 15px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .media-sub { font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .meter { position: relative; width: 23px; height: 24px; flex: none; }
  .meter i { position: absolute; width: 3px; border-radius: 1.5px; background: var(--fg); }
  .media-progress { height: 28px; display: flex; align-items: center; gap: 7px; padding-top: 4px; }
  .transport { display: flex; align-items: center; gap: 4px; flex: none; }
  .transport button {
    width: 24px; height: 24px; border-radius: 12px;
    display: inline-flex; align-items: center; justify-content: center;
    background: var(--card); color: var(--muted);
  }
  .transport button:hover { background: var(--card-hover); color: var(--fg); }
  .transport .icon { width: 12px; height: 12px; }
  .clock { flex: none; font-size: 10.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .track { position: relative; flex: 1; height: 3px; border-radius: 1.5px; background: var(--line); }
  .track .fill { position: absolute; left: 0; top: 0; height: 3px; width: calc(var(--p, .5) * 100%); border-radius: 1.5px; background: var(--fg); }
  .track .thumb {
    position: absolute; top: -3px; left: calc(var(--p, .5) * 100% - 4.5px);
    width: 9px; height: 9px; border-radius: 4.5px;
    background: var(--card); border: 1px solid var(--line);
    box-shadow: 0 1px 2px rgba(0, 0, 0, .18);
  }

  /* ---------- ambient section ---------- */
  .lamp-card { margin-top: 2px; }
  .lamp-row { height: 44px; display: flex; align-items: center; gap: 8px; padding: 0 12px; }
  .lamp-preview { width: 32px; height: 32px; flex: none; border-radius: 9px; }
  .lamp-name { font-size: 13px; font-weight: 500; white-space: nowrap; }
  .lamp-copy { flex: 1; min-width: 0; display: flex; align-items: center; gap: 6px; }
  .chip {
    height: 22px; padding: 0 9px; border-radius: 11px; flex: none;
    display: inline-flex; align-items: center; white-space: nowrap;
    font-size: 11.5px; background: var(--card); border: 1px solid var(--line); color: var(--fg2);
  }
  .lamp-seg { width: 128px; flex: none; }
  .lamp-arrow {
    width: 26px; height: 26px; flex: none; border-radius: 7px;
    display: inline-flex; align-items: center; justify-content: center;
    color: var(--muted);
  }
  .lamp-arrow:hover { background: var(--pill); }
  .lamp-arrow .icon { width: 12px; height: 12px; transition: transform 160ms var(--ease); }
  .lamp-arrow.open .icon { transform: rotate(180deg); }
  .lamp-grid {
    border-top: 1px solid var(--line2); padding: 10px 12px 12px 12px;
    display: grid; grid-template-columns: repeat(10, 30px); gap: 8px 7.5px;
  }
  .lamp-swatch {
    width: 30px; height: 30px; border-radius: 15px; flex: none;
  }
  .lamp-swatch.selected { box-shadow: 0 0 0 2px var(--card), 0 0 0 3.5px var(--accent); }

  .flyout-foot {
    height: 34px; flex: none; display: flex; align-items: center; gap: 6px;
    padding: 4px 12px 6px 14px;
  }
  .face { width: 16px; height: 16px; flex: none; }
  .face svg { display: block; width: 100%; height: 100%; }
  .status { flex: 1; min-width: 0; font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .status.muted { color: var(--muted); }
  .status.green { color: var(--green); }
  .status.red { color: var(--red); }
  .status.accent { color: var(--accent); }
  .update-chip {
    height: 22px; padding: 0 9px; flex: none; border-radius: 11px;
    display: inline-flex; align-items: center;
    background: var(--accent-soft); color: var(--accent);
    font-size: 11.5px; font-weight: 500; white-space: nowrap;
  }
  @media (max-width: 1120px) {
    .notes { width: min(720px, 100%); }
    .stagewrap { justify-content: flex-start; }
  }
</style>
</head>
<body>
<header class="toolbar">
  <div class="brand"><span class="mark" id="brandMark"></span><span class="brand-name">saundo</span><span class="brand-sub">flyout mockup · template</span></div>
  <span class="tool-sep"></span>
  <div class="variant"><span class="variant-dot"></span><span>420 wide · adaptive height</span></div>
  <div class="spacer"></div>
  <span class="tool-label" id="stateLabel">状态</span>
  <div class="tool-group" id="stateGroup" role="group"></div>
  <button type="button" class="tool" id="mediaBtn">媒体卡</button>
  <button type="button" class="tool" id="lampBtn">灯带</button>
  <span class="tool-label" id="zoomLabel">缩放</span>
  <div class="tool-group" id="zoomGroup" role="group">
    <button type="button" data-zoom="1" class="active">100%</button>
    <button type="button" data-zoom="1.25">125%</button>
    <button type="button" data-zoom="1.5">150%</button>
  </div>
  <button type="button" class="tool" id="langBtn">EN</button>
  <button type="button" class="tool" id="themeBtn">深色</button>
</header>

<main class="stagewrap">
  <section class="stage" id="stage"></section>
  <aside class="notes" id="notes"></aside>
</main>

<script>
const ICON = {
  mark: '<svg viewBox="0 0 24 24" fill="none"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="7.4" cy="8.8" r="2.1" fill="currentColor" stroke="none"/><circle cx="16.9" cy="8.8" r="2.3"/><path d="M7.4 14.2c1.5 2.5 3.2 3.8 4.8 3.8s3.3-1.3 4.7-3.8"/></g></svg>',
  faceIdle: '<svg viewBox="0 0 24 24" fill="none"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="7.4" cy="8.8" r="2.1" fill="currentColor" stroke="none"/><circle cx="16.9" cy="8.8" r="2.3"/></g><path d="M8.2 15.4h7.8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>',

/* Height rule, mirroring flyoutHeightFor and flyoutHeightForState:
   459 base, 62 less for the old Now Playing row, 90 ambient, +150 media,
   +44 latency, +48 error, +53 for the expanded six-template grid. */
const FLYOUT_BASE = 459, DEVICE_ROWS = 3, DEVICE_ROW_H = 56, DEVICE_EMPTY = 141;
const NOW_ROW_H = 62, MEDIA_H = 150, LATENCY_H = 44, LAMP_H = 90, ERROR_H = 48;
function deviceCardHeight(n) { return n <= 0 ? DEVICE_EMPTY : Math.min(n, DEVICE_ROWS) * DEVICE_ROW_H + 2; }
function lampGridHeight(count) {
  const rows = Math.min(Math.max(Math.ceil(count / 10), 1), 4);
  return rows * 30 + (rows - 1) * 8 + 22 + 1;
}
function flyoutHeight(n, latency, media, expanded, error) {
  let h = FLYOUT_BASE - (deviceCardHeight(DEVICE_ROWS) - deviceCardHeight(n)) - NOW_ROW_H;
  if (media) h += MEDIA_H;
  if (latency) h += LATENCY_H;
  h += LAMP_H;
  if (error) h += ERROR_H;
  if (expanded) h += lampGridHeight(6);
  return h;
}

}
function playbackSectionHTML() {
  const head = '<div class="section-head"><span class="section-label">' + esc(t('playback')) + '</span>' +
    '<span class="section-note">' + esc(playbackNote()) + '</span></div>';
  let card = '<div class="card playback-card">';
  card += '<div class="volume"><div class="volume-head"><span class="volume-label">' + esc(t('volume')) + '</span>' +
    '<span class="volume-value">65%</span></div>' +
    '<div class="range" style="--value:.65"><span class="range-knob"></span></div></div>';
  card += '<div class="line"></div>';
  if (state.latency) {
    card += '<div class="latency"><div class="seg">' +
      ['latencyLow', 'latencyStandard', 'latencyStable', 'sliders'].map((name, i) =>
        '<button type="button" class="' + (i === 0 ? 'active' : '') + '">' + icon(name) + esc(t('latencyModes')[i]) + '</button>').join('') +
    '</div></div>';
    card += '<div class="line"></div>';
  }
  card += mediaCardHTML();
  card += '</div>';
  return head + card;
}
function lampSectionHTML() {
  const templateMode = state.lamp !== 'cover';
  const expanded = state.lamp === 'expanded';
  const preset = LAMP_PRESETS[1];
  const name = templateMode ? preset[state.lang] || preset.en : t('lampCover');
  const previewStyle = templateMode ? lampGlow(preset.colors) : coverGlow();
  const head = '<div class="section-head"><span class="section-label">' + esc(t('lamp')) + '</span>' +
    '<button type="button" class="icon-btn" style="margin-left:auto">' + icon('power') + '</button></div>';
  let row = '<div class="lamp-row">' +
    '<span class="lamp-preview" style="background:' + previewStyle + '"></span>' +
    '<span class="lamp-copy"><span class="lamp-name">' + esc(name) + '</span>' +
      (state.view === 'standby' ? '<span class="chip">' + esc(t('standby')) + '</span>' : '') +
    '</span>' +
    '<span class="seg lamp-seg">' +
      '<button type="button" class="' + (templateMode ? '' : 'active') + '">' + esc(t('lampCover')) + '</button>' +
      '<button type="button" class="' + (templateMode ? 'active' : '') + '">' + esc(t('lampTemplate')) + '</button>' +
    '</span>';
  if (templateMode) {
    row += '<button type="button" class="lamp-arrow' + (expanded ? ' open' : '') + '">' + icon('chevron') + '</button>';
  }
  row += '</div>';
  if (templateMode && expanded) {
    row += '<div class="lamp-grid">' + LAMP_PRESETS.map(p =>
      '<span class="lamp-swatch' + (p.id === preset.id ? ' selected' : '') + '" style="background:' + lampGlow(p.colors) + '"></span>').join('') +
    '</div>';
  }
  return '<div>' + head + '<div class="card lamp-card">' + row + '</div></div>';
}
function footerHTML() {
  const map = {
    idle: { face: 'faceIdle', status: 'statusIdle', cls: 'muted' },
    streaming: { face: 'faceStream', status: 'statusStreaming', cls: 'green' },
    standby: { face: 'faceStream', status: 'statusStandby', cls: 'green' },
    empty: { face: 'faceSearch', status: 'statusIdle', cls: 'muted' },
    error: { face: 'faceError', status: 'statusError', cls: 'red' }
  };
  const f = map[state.view] || map.idle;
  return '<footer class="flyout-foot">' +
    '<span class="face">' + ICON[f.face] + '</span>' +
    '<span class="status ' + f.cls + '">' + esc(t(f.status)) + '</span>' +
  '</footer>';
}
function flyoutHTML(devices, height) {
  return '<div class="flyout" style="--fh:' + height + 'px">' +
    '<header class="flyout-head">' + icon('mark', 'mark') +
      '<div><div class="app-name">' + esc(t('appName')) + '</div><div class="app-sub">' + esc(t('appSub')) + '</div></div>' +
      '<span class="spacer"></span>' +
      '<button type="button" class="icon-btn">' + icon('refresh') + '</button>' +
      '<button type="button" class="icon-btn">' + icon('gear') + '</button>' +
    '</header>' +
    '<div class="flyout-body">' +
      deviceSectionHTML(devices) +
      playbackSectionHTML() +
      lampSectionHTML() +
    '</div>' +
    footerHTML() +
  '</div>';
}

function render() {
  const devices = DEVICES[state.view] || DEVICES.idle;
  const expanded = state.lamp === 'expanded';
  const height = flyoutHeight(devices.length, state.latency, state.media, expanded, state.view === 'error');
  document.documentElement.lang = state.lang === 'zh' ? 'zh-CN' : 'en';
  document.body.classList.toggle('dark', state.dark);
  document.getElementById('brandMark').innerHTML = ICON.mark;
  const stage = document.getElementById('stage');
  stage.style.setProperty('--fh', height + 'px');
  stage.style.setProperty('--zoom', state.zoom);
  stage.innerHTML = flyoutHTML(devices, height);
  document.getElementById('notes').innerHTML = notesHTML();
  document.getElementById('langBtn').textContent = state.lang === 'zh' ? 'EN' : '中文';
  document.getElementById('themeBtn').innerHTML = state.dark
    ? (state.lang === 'zh' ? '浅色' : 'Light')
    : icon('moon') + (state.lang === 'zh' ? '深色' : 'Dark');
  document.getElementById('stateLabel').textContent = state.lang === 'zh' ? '状态' : 'State';
  document.getElementById('zoomLabel').textContent = state.lang === 'zh' ? '缩放' : 'Zoom';
  document.getElementById('mediaBtn').textContent = state.lang === 'zh' ? '媒体卡' : 'Media card';
  document.getElementById('mediaBtn').classList.toggle('active', state.media);
  const lampLabels = state.lang === 'zh'
    ? { cover: '灯带·封面', template: '灯带·模板', expanded: '灯带·展开' }
    : { cover: 'Light cover', template: 'Light template', expanded: 'Light grid' };
  document.getElementById('lampBtn').textContent = lampLabels[state.lamp] || lampLabels.cover;
  document.getElementById('lampBtn').classList.toggle('active', state.lamp !== 'cover');
  document.getElementById('stateGroup').innerHTML = STATES.map(item =>
    '<button type="button" data-state="' + item.id + '" class="' + (state.view === item.id ? 'active' : '') + '">' +
    esc(item[state.lang]) + '</button>').join('');
  document.querySelectorAll('#zoomGroup button').forEach(button => {
    button.classList.toggle('active', Number(button.dataset.zoom) === state.zoom);
  });
}

document.getElementById('stateGroup').addEventListener('click', e => {
  const button = e.target.closest('[data-state]');
  if (!button) return;
  state.view = button.dataset.state;
  render();
});
document.getElementById('zoomGroup').addEventListener('click', e => {
  const button = e.target.closest('[data-zoom]');
  if (!button) return;
  state.zoom = Number(button.dataset.zoom);
  render();
});
document.getElementById('mediaBtn').addEventListener('click', () => {
  state.media = !state.media;
  render();
});
document.getElementById('lampBtn').addEventListener('click', () => {
  state.lamp = state.lamp === 'cover' ? 'template' : state.lamp === 'template' ? 'expanded' : 'cover';
  render();
});
document.getElementById('langBtn').addEventListener('click', () => {
  state.lang = state.lang === 'zh' ? 'en' : 'zh';
  render();
});
document.getElementById('themeBtn').addEventListener('click', () => {
  state.dark = !state.dark;
  render();
});

render();
</script>
</body>
</html>
