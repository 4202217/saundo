<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>saundo · UI mockup</title>
<!--
  saundo UI mockup template.

  Copy this file to .audit/mockups/<topic>/mockup.html and edit only the
  marked blocks: NAV, PAGE, STATES, COPY, the three view functions, and the
  notes. Keep the tokens, window chrome, toolbar, and helpers.

  Render:
    chrome --headless=new --hide-scrollbars --window-size=1400,900 \
      --screenshot=.audit/previews/<topic>.png file:///.../mockup-<topic>.html

  Headless shots can select a state from the URL:
    ?view=target|normal|edge&lang=zh|en&dark=0|1&zoom=1|1.25|1.5

  The window is the real settings surface: 720x500, 190 sidebar, 14/20
  page insets. The page body is the slot the mockup exists to decide.
-->
<style>
  * { box-sizing: border-box; }
  html, body { min-height: 100%; }
  body {
    --bg: #f4f4f6; --panel: #f2f2f5; --card: #ffffff; --card-hover: #f9f9fb;
    --pill: #f1f1f4; --pill-hover: #e9e9ed; --line: #e3e3e8; --line2: #ececf0;
    --fg: #1c1c21; --fg2: #4b4b53; --ctl: #63636b; --muted: #85858d; --faint: #b9b9c2;
    --accent: #4f46e5; --accent-soft: #eeedfd; --accent-fg: #ffffff;
    --sel: #ecebfb; --green: #189a58; --green-soft: #e4f6ec;
    --red: #d64545; --red-soft: #fbe9e9;
    --window-shadow: 0 24px 70px rgba(20, 22, 30, .22);
    --raised-shadow: 0 1px 2px rgba(0, 0, 0, .14);
    --ease: cubic-bezier(.16, 1, .3, 1);
    color-scheme: light;
    margin: 0;
    background: #e8e8ed;
    color: var(--fg);
    font-family: "Segoe UI Variable Text", "Segoe UI", "Microsoft YaHei UI", "Microsoft YaHei", system-ui, sans-serif;
    font-size: 13px;
    -webkit-font-smoothing: antialiased;
  }
  body.dark {
    --bg: #1a1a1e; --panel: #1b1c20; --card: #232327; --card-hover: #26262b;
    --pill: #2d2d33; --pill-hover: #35353c; --line: #333339; --line2: #2c2c32;
    --fg: #ededf1; --fg2: #b9b9c1; --ctl: #a1a1aa; --muted: #8b8b94; --faint: #56565f;
    --accent: #a5b4fc; --accent-soft: #2b2c47; --accent-fg: #14142a;
    --sel: #33345a; --green: #6fd99b; --green-soft: #1e3a2b;
    --red: #f28b82; --red-soft: #45272a;
    --window-shadow: 0 30px 90px rgba(0, 0, 0, .62);
    --raised-shadow: 0 1px 2px rgba(0, 0, 0, .48);
    color-scheme: dark;
    background: #101013;
  }
  button, input, select { font: inherit; color: inherit; }
  button { border: 0; background: none; padding: 0; cursor: pointer; }
  .icon { display: inline-flex; width: 14px; height: 14px; flex: none; }
  .icon svg { display: block; width: 100%; height: 100%; }
  button:focus-visible, [role="button"]:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }

  /* ---------- mockup chrome, outside the product window ---------- */
  .toolbar {
    position: sticky; top: 0; z-index: 20;
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 10px 22px;
    background: rgba(255, 255, 255, .88);
    backdrop-filter: blur(14px);
    border-bottom: 1px solid rgba(28, 28, 33, .08);
  }
  body.dark .toolbar { background: rgba(18, 18, 22, .88); border-bottom-color: rgba(255, 255, 255, .07); }
  .brand { display: flex; align-items: center; gap: 8px; white-space: nowrap; }
  .brand .mark { width: 17px; height: 17px; display: inline-flex; color: var(--fg); }
  .brand .mark svg { display: block; width: 100%; height: 100%; }
  .brand-name { font-size: 14px; font-weight: 650; letter-spacing: -.15px; }
  .brand-sub { color: var(--muted); font-size: 11.5px; }
  .tool-sep { width: 1px; height: 16px; background: var(--line); margin: 0 2px; }
  .variant { display: inline-flex; align-items: center; gap: 7px; font-size: 11.5px; color: var(--fg2); white-space: nowrap; }
  .variant-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .toolbar .spacer { flex: 1; }
  .tool-label { font-size: 10.5px; color: var(--faint); letter-spacing: .4px; }
  .tool-group { display: flex; align-items: center; gap: 2px; padding: 2px; border-radius: 9px; background: var(--pill); }
  .tool-group button {
    height: 26px; min-width: 44px; padding: 0 8px; border-radius: 7px;
    font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums;
    transition: background 120ms var(--ease), color 120ms var(--ease);
  }
  .tool-group button:hover { color: var(--fg2); }
  .tool-group button.active { background: var(--card); color: var(--fg); box-shadow: var(--raised-shadow); }
  .tool {
    height: 30px; padding: 0 11px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--card);
    font-size: 11.5px; color: var(--fg2); white-space: nowrap;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .tool:hover { background: var(--pill); color: var(--fg); }
  .tool .icon { width: 13px; height: 13px; color: var(--muted); }

  .stagewrap {
    display: flex; align-items: flex-start; justify-content: center;
    gap: 32px; padding: 26px 24px 44px; flex-wrap: wrap;
  }
  .stage { flex: none; width: calc(720px * var(--zoom, 1)); height: calc(500px * var(--zoom, 1)); }
  .notes { width: 306px; padding-top: 2px; font-size: 12px; line-height: 1.65; color: var(--fg2); }
  .notes h2 { margin: 0 0 6px; font-size: 14.5px; font-weight: 650; letter-spacing: -.1px; color: var(--fg); }
  .notes-intro { margin: 0; font-size: 11.5px; line-height: 1.6; color: var(--muted); }
  .notes .kicker { margin: 18px 0 7px; font-size: 10px; letter-spacing: .8px; color: var(--faint); }
  .notes ul { margin: 0; padding: 0; list-style: none; }
  .notes li { position: relative; margin: 0 0 8px; padding-left: 13px; font-size: 11.5px; line-height: 1.6; color: var(--fg2); }
  .notes li::before { content: ""; position: absolute; left: 2px; top: 8px; width: 4px; height: 4px; border-radius: 50%; background: var(--faint); }
  .notes li b { font-weight: 600; color: var(--fg); margin-right: 4px; }

  /* ---------- product window ---------- */
  .window {
    width: 720px; height: 500px; flex: none;
    display: flex; flex-direction: column;
    position: relative; overflow: hidden;
    border-radius: 10px; border: 1px solid var(--line);
    background: var(--bg); color: var(--fg);
    box-shadow: var(--window-shadow);
    transform: scale(var(--zoom, 1)); transform-origin: top left;
  }
  .titlebar {
    height: 32px; flex: none; display: flex; align-items: center; gap: 8px;
    padding: 0 5px 0 12px; border-bottom: 1px solid var(--line2);
    color: var(--fg2); font-size: 11.5px; white-space: nowrap;
  }
  .titlebar .mark { width: 14px; height: 14px; color: var(--fg); }
  .titlebar-title { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .wincontrols { margin-left: auto; display: flex; align-items: center; gap: 2px; color: var(--ctl); }
  .wincontrol { width: 30px; height: 24px; display: inline-flex; align-items: center; justify-content: center; border-radius: 6px; }
  .wincontrol .icon { width: 10px; height: 10px; }
  .shell { flex: 1; min-height: 0; display: flex; }

  .sidebar {
    width: 190px; flex: none; display: flex; flex-direction: column;
    padding: 10px; border-right: 1px solid var(--line2); background: var(--bg);
  }
  .nav { display: flex; flex-direction: column; gap: 2px; }
  .nav-item {
    height: 32px; padding: 0 9px; border-radius: 7px;
    display: flex; align-items: center; gap: 8px;
    font-size: 12.5px; color: var(--fg2);
  }
  .nav-item .icon { width: 15px; height: 15px; color: var(--muted); }
  .nav-item.active { background: var(--card); color: var(--fg); font-weight: 500; box-shadow: var(--raised-shadow); }
  .nav-item.active .icon { color: var(--fg); }
  .sidebar .spacer { flex: 1; }
  .identity {
    display: flex; align-items: center; gap: 8px;
    padding: 9px 5px 2px; margin-top: 6px;
    border-top: 1px solid var(--line2);
  }
  .identity-glyph {
    position: relative; width: 24px; height: 24px; flex: none;
    display: flex; align-items: center; justify-content: center;
    border-radius: 12px; background: var(--pill); color: var(--fg2);
  }
  .identity-glyph .icon { width: 13px; height: 13px; }
  .identity-glyph .online {
    position: absolute; right: -1px; bottom: -1px;
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--green); box-shadow: 0 0 0 2px var(--bg);
  }
  .identity-copy .name { font-size: 12.5px; }
  .identity-copy .sub { font-size: 10.5px; color: var(--muted); }

  .page { flex: 1; min-width: 0; display: flex; flex-direction: column; padding: 14px 0 10px 0; }
  .page-head { padding: 0 20px 0 20px; }
  .page-title { font-size: 18px; font-weight: 650; }
  .page-desc { margin-top: 4px; font-size: 13px; color: var(--muted); }
  .page-rule { height: 1px; background: var(--line); margin-top: 10px; }
  .pagebody { flex: 1; min-height: 0; overflow: auto; padding: 4px 20px 0 20px; }

  /* ---------- page helpers, replace the sample content ---------- */
  .group-head {
    display: flex; align-items: center; gap: 7px;
    font-size: 11px; font-weight: 600; letter-spacing: .3px; color: var(--muted);
    margin-top: 6px;
  }
  .count {
    height: 18px; min-width: 18px; padding: 0 6px; border-radius: 9px;
    display: inline-flex; align-items: center; justify-content: center;
    background: var(--pill); color: var(--muted);
    font-size: 10.5px; font-weight: 500; letter-spacing: 0; font-variant-numeric: tabular-nums;
  }
  .card {
    margin-top: 8px; border: 1px solid var(--line); border-radius: 12px;
    background: var(--card); overflow: hidden;
  }
  .row { display: flex; align-items: center; gap: 11px; min-height: 58px; padding: 8px 14px; }
  .row + .row { border-top: 1px solid var(--line2); }
  .glyph {
    position: relative; width: 30px; height: 30px; flex: none;
    display: flex; align-items: center; justify-content: center;
    border-radius: 15px; background: var(--pill); color: var(--fg2);
  }
  .glyph .icon { width: 16px; height: 16px; }
  .glyph .online {
    position: absolute; right: -1px; bottom: -1px;
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--green); box-shadow: 0 0 0 2px var(--card);
  }
  .namecol { display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1; }
  .name-line { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .name { font-size: 13px; font-weight: 500; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sub { font-size: 11.5px; line-height: 1.35; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chip {
    height: 20px; padding: 0 8px; border-radius: 10px; flex: none;
    display: inline-flex; align-items: center; white-space: nowrap;
    font-size: 10.5px; font-weight: 500; background: var(--pill); color: var(--muted);
  }
  .chip.ok { background: var(--green-soft); color: var(--green); }
  .switch {
    position: relative; width: 32px; height: 19px; flex: none;
    border-radius: 9.5px; background: var(--faint);
  }
  .switch::after {
    content: ""; position: absolute; top: 2px; left: 2px;
    width: 15px; height: 15px; border-radius: 50%;
    background: #fff; box-shadow: 0 1px 2px rgba(0, 0, 0, .25);
  }
  .switch.on { background: var(--fg); }
  .switch.on::after { transform: translateX(13px); background: var(--bg); }

  .add-row {
    width: 100%; margin-top: 12px; min-height: 44px; padding: 9px 14px;
    display: flex; align-items: center; gap: 10px;
    border: 1px dashed color-mix(in srgb, var(--line) 55%, var(--muted) 45%);
    border-radius: 12px; background: transparent; text-align: left; color: var(--accent);
  }
  .add-row:hover { background: var(--pill); border-color: var(--muted); }
  .add-plus {
    width: 24px; height: 24px; flex: none; border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    background: var(--accent-soft); color: var(--accent);
  }
  .add-plus .icon { width: 12px; height: 12px; }
  .add-copy { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
  .add-title { font-size: 12.5px; font-weight: 500; }
  .add-sub { font-size: 10.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .empty-note { margin: 2px 0 0; padding: 0; }
  .empty-note-title { font-size: 12.5px; font-weight: 500; line-height: 1.4; color: var(--fg2); }
  .empty-note-hint { margin-top: 3px; font-size: 11.5px; line-height: 1.45; color: var(--muted); }
  .empty-note-line { font-size: 11.5px; line-height: 1.5; color: var(--muted); }

  .divider { height: 1px; background: var(--line2); }
  .hidden-group { margin-top: 12px; padding-top: 8px; border-top: 1px solid var(--line2); }
  .group-toggle {
    height: 28px; padding: 0 8px 0 4px; border-radius: 7px;
    display: inline-flex; align-items: center; gap: 6px;
    color: var(--muted); font-size: 11px; font-weight: 600; letter-spacing: .3px;
  }
  .group-toggle:hover { background: var(--pill); }
  .chev { width: 12px; height: 12px; flex: none; color: var(--muted); }
  .chev.closed { transform: rotate(-90deg); }

  @media (max-width: 1120px) {
    .notes { width: min(720px, 100%); }
    .stagewrap { justify-content: flex-start; }
  }
</style>
</head>
<body>
<header class="toolbar">
  <div class="brand"><span class="mark" id="brandMark"></span><span class="brand-name">saundo</span><span class="brand-sub">UI mockup · template</span></div>
  <span class="tool-sep"></span>
  <div class="variant"><span class="variant-dot"></span><span>Replace the page body, keep the shell</span></div>
  <div class="spacer"></div>
  <span class="tool-label" id="viewLabel">状态</span>
  <div class="tool-group" id="viewGroup" role="group"></div>
  <span class="tool-label" id="zoomLabel">缩放</span>
  <div class="tool-group" id="zoomGroup" role="group">
    <button type="button" data-zoom="1" class="active">100%</button>
    <button type="button" data-zoom="1.25">125%</button>
    <button type="button" data-zoom="1.5">150%</button>
  </div>
  <button type="button" class="tool" id="langBtn">EN</button>
  <button type="button" class="tool" id="themeBtn">深色</button>
</header>

<main class="stagewrap">
  <section class="stage" id="stage"></section>
  <aside class="notes" id="notes"></aside>
</main>

<script>
const ICON = {
  mark: '<svg viewBox="0 0 24 24" fill="none"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="7.4" cy="8.8" r="2.1" fill="currentColor" stroke="none"/><circle cx="16.9" cy="8.8" r="2.3"/><path d="M7.4 14.2c1.5 2.5 3.2 3.8 4.8 3.8s3.3-1.3 4.7-3.8"/></g></svg>',
  sliders: '<svg viewBox="0 0 20 20" fill="none"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M3 6h14M3 10h14M3 14h14"/></g><g fill="currentColor"><circle cx="7" cy="6" r="2.1"/><circle cx="13" cy="10" r="2.1"/><circle cx="8" cy="14" r="2.1"/></g></svg>',
  link: '<svg viewBox="0 0 24 24" fill="none"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 14l4-4M8 11.5 6.2 13.3a3.8 3.8 0 0 0 5.4 5.4l1.8-1.8M16 12.5l1.8-1.8a3.8 3.8 0 0 0-5.4-5.4L10.6 7"/></g></svg>',
  speaker: '<svg viewBox="0 0 24 24" fill="none"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><rect x="6.5" y="2.5" width="11" height="19" rx="5.5"/><path d="M9.5 18.5h5"/><circle cx="12" cy="8" r="1" fill="currentColor" stroke="none"/></g></svg>',
  wave: '<svg viewBox="0 0 20 20" fill="none"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 8v4M8 5v10M12 8v4M16 6v8"/></g></svg>',
  screen: '<svg viewBox="0 0 20 20" fill="none"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="4" width="15" height="10" rx="1.6"/><path d="M7 17h6"/></g></svg>',
  refresh: '<svg viewBox="0 0 24 24" fill="none"><g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M19.5 12a7.5 7.5 0 1 1-2.2-5.3M19.5 4v4.5h-4.5"/></g></svg>',
  plus: '<svg viewBox="0 0 24 24" fill="none"><g stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></g></svg>',
  chevron: '<svg viewBox="0 0 12 12" fill="none"><path d="M2.5 4.5 6 8l3.5-3.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  pencil: '<svg viewBox="0 0 24 24" fill="none"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19.5 8.5a2.1 2.1 0 0 0-3-3L5 17v3z"/><path d="M14.5 5.5l4 4"/></g></svg>',
  key: '<svg viewBox="0 0 24 24" fill="none"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="8.5" cy="15.5" r="3.5"/><path d="M11 13 20 4M17 7l2.5 2.5M14.5 9.5l2 2"/></g></svg>',
  eyeOff: '<svg viewBox="0 0 20 20" fill="none"><g stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2.8 10s2.6-4.5 7.2-4.5S17.2 10 17.2 10s-2.6 4.5-7.2 4.5S2.8 10 2.8 10Z"/><circle cx="10" cy="10" r="2"/><path d="M4 4l12 12"/></g></svg>',
  close: '<svg viewBox="0 0 12 12" fill="none"><path d="M3 3l6 6M9 3l-6 6" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"/></svg>',
  min: '<svg viewBox="0 0 12 12" fill="none"><path d="M2.5 8.5h7" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"/></svg>',
  max: '<svg viewBox="0 0 12 12" fill="none"><rect x="2.7" y="2.7" width="6.6" height="6.6" rx="1" stroke="currentColor" stroke-width="1.1"/></svg>',
  moon: '<svg viewBox="0 0 20 20" fill="none"><path d="M16 12.4A6.4 6.4 0 0 1 7.6 4a6.5 6.5 0 1 0 8.4 8.4Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>'
};
function icon(name, cls = '') { return '<span class="icon ' + cls + '" aria-hidden="true">' + ICON[name] + '</span>'; }
function esc(value) { return String(value).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

/* =========================================================================
   EDIT FROM HERE
   ========================================================================= */

const NAV = [
  { id: 'general',   zh: '通用',   en: 'General',   icon: 'sliders' },
  { id: 'connection',zh: '连接',   en: 'Connection',icon: 'link' },
  { id: 'receivers', zh: '接收器', en: 'Receivers', icon: 'speaker' },
  { id: 'audio',     zh: '音频',   en: 'Audio',     icon: 'wave' },
  { id: 'capture',   zh: '采集',   en: 'Capture',   icon: 'screen' },
  { id: 'updates',   zh: '更新',   en: 'Updates',   icon: 'refresh' }
];

const PAGE = {
  active: 'receivers',
  title:    { zh: '页面标题', en: 'Page title' },
  subtitle: { zh: '一句话说明这个页面。', en: 'One sentence describing this page.' }
};

const STATES = [
  { id: 'target', zh: '目标态', en: 'Target' },
  { id: 'normal', zh: '正常态', en: 'Normal' },
  { id: 'edge',   zh: '边界态', en: 'Edge' }
];

const COPY = {
  zh: {
    section: '示例分组',
    addTitle: '添加项', addSub: '手动填写地址或说明',
    rowA: '示例项 A', rowASub: '型号 · 192.168.1.20:7000',
    rowB: '示例项 B', rowBSub: '型号 · 192.168.1.21:7000',
    targetHint: '目标态的内容放在这里。替换这个区块。',
    edgeTitle: '边界态标题',
    edgeHint: '边界态的一行说明。',
    identity: '未选择设备', identitySub: '未连接'
  },
  en: {
    section: 'Example group',
    addTitle: 'Add item', addSub: 'Fill in an address or note manually',
    rowA: 'Example A', rowASub: 'Model · 192.168.1.20:7000',
    rowB: 'Example B', rowBSub: 'Model · 192.168.1.21:7000',
    targetHint: 'Put the target state here. Replace this block.',
    edgeTitle: 'Edge state title',
    edgeHint: 'One line describing the edge state.',
    identity: 'No device selected', identitySub: 'Not connected'
  }
};

/* Replace these three functions with the states you are deciding. */
function viewTarget() {
  return '<div class="empty-note"><div class="empty-note-line">' + esc(COPY[state.lang].targetHint) + '</div></div>' + addRowHTML();
}
function viewNormal() {
  return groupHead(COPY[state.lang].section, 2) +
    '<div class="card">' +
      exampleRow(COPY[state.lang].rowA, COPY[state.lang].rowASub, true) +
      exampleRow(COPY[state.lang].rowB, COPY[state.lang].rowBSub, false) +
    '</div>' + addRowHTML();
}
function viewEdge() {
  return '<div class="empty-note">' +
    '<div class="empty-note-title">' + esc(COPY[state.lang].edgeTitle) + '</div>' +
    '<div class="empty-note-hint">' + esc(COPY[state.lang].edgeHint) + '</div>' +
  '</div>' + addRowHTML();
}

/* Replace the notes with the stance, states, locale keys, and rejects. */
function notesHTML() {
  return '<h2>设计说明 · Design notes</h2>' +
    '<p class="notes-intro">One or two sentences: the stance this mockup commits to, and what it deliberately rejects. Replace this text.</p>' +
    '<p class="kicker">状态 · STATES</p><ul>' +
      '<li><b>目标态</b> The state this mockup exists to decide.</li>' +
      '<li><b>正常态</b> The page with content, for rhythm and continuity.</li>' +
      '<li><b>边界态</b> The empty, all-hidden, or failure state that shares the layout.</li>' +
    '</ul>' +
    '<p class="kicker">新增文案 · NEW STRINGS</p><ul>' +
      '<li><code>key</code> zh-CN / English</li>' +
    '</ul>' +
    '<p class="kicker">取舍 · REJECTED</p><ul>' +
      '<li>The alternative you threw away, and why.</li>' +
    '</ul>';
}

/* =========================================================================
   STOP EDITING HERE
   ========================================================================= */

const params = new URLSearchParams(location.search);
const state = {
  view: params.get('view') || 'target',
  lang: params.get('lang') === 'en' ? 'en' : 'zh',
  dark: params.get('dark') === '1',
  zoom: Number(params.get('zoom')) || 1
};

function t(key) { return COPY[state.lang][key]; }
function groupHead(label, count) {
  return '<div class="group-head"><span>' + esc(label) + '</span><span class="count">' + count + '</span></div>';
}
function exampleRow(name, sub, online) {
  return '<div class="row">' +
    '<span class="glyph">' + icon('speaker') + (online ? '<i class="online"></i>' : '') + '</span>' +
    '<span class="namecol"><span class="name-line"><span class="name">' + esc(name) + '</span></span>' +
    '<span class="sub">' + esc(sub) + '</span></span>' +
    '<span class="switch' + (online ? ' on' : '') + '"></span>' +
  '</div>';
}
function addRowHTML() {
  return '<button type="button" class="add-row">' +
    '<span class="add-plus">' + icon('plus') + '</span>' +
    '<span class="add-copy"><span class="add-title">' + esc(t('addTitle')) + '</span>' +
    '<span class="add-sub">' + esc(t('addSub')) + '</span></span></button>';
}

function sidebarHTML() {
  return '<aside class="sidebar"><nav class="nav" aria-label="Settings pages">' +
    NAV.map(item => '<div class="nav-item' + (item.id === PAGE.active ? ' active' : '') + '">' +
      icon(item.icon) + '<span>' + esc(item[state.lang]) + '</span></div>').join('') +
    '</nav><div class="spacer"></div>' +
    '<div class="identity"><span class="identity-glyph">' + icon('speaker') + '</span>' +
      '<div class="identity-copy"><div class="name">' + esc(t('identity')) + '</div>' +
      '<div class="sub">' + esc(t('identitySub')) + '</div></div></div></aside>';
}
function titlebarHTML() {
  return '<div class="titlebar">' + icon('mark', 'mark') +
    '<span class="titlebar-title">' + (state.lang === 'zh' ? '设置 · 声渡' : 'Settings · saundo') + '</span>' +
    '<span class="wincontrols" aria-hidden="true">' +
      '<span class="wincontrol">' + icon('min') + '</span>' +
      '<span class="wincontrol">' + icon('max') + '</span>' +
      '<span class="wincontrol">' + icon('close') + '</span>' +
    '</span></div>';
}
function pageHTML() {
  const body = state.view === 'target' ? viewTarget() : state.view === 'normal' ? viewNormal() : viewEdge();
  return '<section class="page">' +
    '<div class="page-head"><div class="page-title">' + esc(PAGE.title[state.lang]) + '</div>' +
    '<div class="page-desc">' + esc(PAGE.subtitle[state.lang]) + '</div>' +
    '<div class="page-rule"></div></div>' +
    '<div class="pagebody">' + body + '</div>' +
  '</section>';
}
function render() {
  document.documentElement.lang = state.lang === 'zh' ? 'zh-CN' : 'en';
  document.title = 'saundo · ' + PAGE.title[state.lang] + ' · mockup';
  document.body.classList.toggle('dark', state.dark);
  document.getElementById('brandMark').innerHTML = ICON.mark;
  document.getElementById('stage').innerHTML =
    '<div class="window">' + titlebarHTML() + '<div class="shell">' + sidebarHTML() + pageHTML() + '</div></div>';
  document.getElementById('stage').style.setProperty('--zoom', state.zoom);
  document.getElementById('notes').innerHTML = notesHTML();
  document.getElementById('langBtn').textContent = state.lang === 'zh' ? 'EN' : '中文';
  document.getElementById('themeBtn').innerHTML = state.dark
    ? (state.lang === 'zh' ? '浅色' : 'Light')
    : icon('moon') + (state.lang === 'zh' ? '深色' : 'Dark');
  document.getElementById('viewLabel').textContent = state.lang === 'zh' ? '状态' : 'State';
  document.getElementById('zoomLabel').textContent = state.lang === 'zh' ? '缩放' : 'Zoom';
  document.getElementById('viewGroup').innerHTML = STATES.map(item =>
    '<button type="button" data-view="' + item.id + '" class="' + (state.view === item.id ? 'active' : '') + '">' +
    esc(item[state.lang]) + '</button>').join('');
  document.querySelectorAll('#zoomGroup button').forEach(button => {
    button.classList.toggle('active', Number(button.dataset.zoom) === state.zoom);
  });
}

document.getElementById('viewGroup').addEventListener('click', e => {
  const button = e.target.closest('[data-view]');
  if (!button) return;
  state.view = button.dataset.view;
  render();
});
document.getElementById('zoomGroup').addEventListener('click', e => {
  const button = e.target.closest('[data-zoom]');
  if (!button) return;
  state.zoom = Number(button.dataset.zoom);
  document.querySelectorAll('#zoomGroup button').forEach(b => b.classList.toggle('active', b === button));
  render();
});
document.getElementById('langBtn').addEventListener('click', () => {
  state.lang = state.lang === 'zh' ? 'en' : 'zh';
  render();
});
document.getElementById('themeBtn').addEventListener('click', () => {
  state.dark = !state.dark;
  render();
});

render();
</script>
</body>
</html>
