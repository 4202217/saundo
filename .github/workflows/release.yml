name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Format
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "unformatted files:"
            echo "$unformatted"
            exit 1
          fi
      - name: Catalogs
        run: go tool mygo i18n check cmd/saundo
      - name: Vet
        run: go vet ./...
      - name: Vet the update harness
        run: go vet -tags updateharness ./cmd/saundo
      - name: UI vet
        run: go tool mygo vet .
      - name: Tests
        run: go test -short ./...
      - name: Verify map
        shell: bash
        run: scripts/check-verify-map.sh
      - name: Platforms
        run: go run ./scripts/check-platforms

  draft:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check the version
        run: test "$GITHUB_REF_NAME" = "v$(jq -r .version cmd/saundo/mygo.json)"
      - name: Check the tag is on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_REF_NAME" origin/main
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --draft --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
          fi

  build:
    needs: [check, draft]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Cache NSIS
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\mygo\nsis-*
          key: nsis-${{ hashFiles('go.sum') }}
      - name: Stamp the version
        shell: pwsh
        working-directory: cmd/saundo
        run: |
          $version = (Get-Content mygo.json -Raw | ConvertFrom-Json).version
          "MYGO_LDFLAGS=-X saundo/internal/app.Version=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build and upload
        working-directory: cmd/saundo
        env:
          GH_TOKEN: ${{ github.token }}
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: go tool mygo build -platform windows/amd64 -upload
      # Code signing is not configured yet. Add windows.certificate or
      # windows.signCommand to cmd/saundo/mygo.json and the certificate secrets
      # before publishing a public release.

  check-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Format
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "unformatted files:"
            echo "$unformatted"
            exit 1
          fi
      - name: Catalogs
        run: go tool mygo i18n check cmd/saundo
      - name: Vet
        run: go vet ./...
      - name: UI vet
        run: go tool mygo vet .
      - name: Tests
        env:
          SAUNDO_CREDS_MASTER_KEY: "6b65797320617265206e6f7420736563726574732e2074657374206f6e6c792e"
        run: go test -short ./...
      - name: Verify map
        run: bash scripts/check-verify-map.sh

  build-macos:
    # After the Windows build, because both upload SHA256SUMS and mygo merges
    # the existing lines when it publishes.
    needs: [check, check-macos, draft, build]
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Stamp the version
        working-directory: cmd/saundo
        run: |
          version=$(jq -r .version mygo.json)
          echo "MYGO_LDFLAGS=-X saundo/internal/app.Version=$version" >> "$GITHUB_ENV"
      - name: Adapter
        run: bash scripts/build-adapter.sh
      - name: Build and upload
        working-directory: cmd/saundo
        env:
          GH_TOKEN: ${{ github.token }}
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          sign="${MACOS_SIGN_IDENTITY:--}"
          go tool mygo build -platform darwin/arm64 -skip-build-command -sign "$sign" -upload
      # The app updates in place from the signed darwin manifest. Without a
      # Developer ID the build stays ad-hoc signed, so each update changes
      # the app's cdhash and macOS can ask again for TCC and Keychain access.
