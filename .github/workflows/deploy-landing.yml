name: Deploy landing page

on:
  push:
    branches: [main]
    paths:
      - "site/index.html"
      - "site/assets/**"
      - "LICENSES/OFL-1.1-Geist.txt"
      - "NOTICE"
      - ".github/workflows/deploy-landing.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Stage the published files
        run: |
          mkdir -p _site
          cp site/index.html _site/
          cp -R site/assets _site/assets
          rm -rf _site/assets/src
          cp LICENSES/OFL-1.1-Geist.txt _site/OFL-1.1-Geist.txt
          cp NOTICE _site/NOTICE.txt
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
